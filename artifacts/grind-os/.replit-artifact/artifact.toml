kind = "web"
previewPath = "/"
title = "Grind OS"
version = "1.0.0"
id = "artifacts/grind-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25177

[services.development]
run = "pnpm --filter @workspace/grind-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grind-os", "run", "build" ]
publicDir = "artifacts/grind-os/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25177"
BASE_PATH = "/"
