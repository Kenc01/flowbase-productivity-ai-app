kind = "web"
previewPath = "/"
title = "FlowBase"
version = "1.0.0"
id = "artifacts/flowbase"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19868

[services.development]
run = "pnpm --filter @workspace/flowbase run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flowbase", "run", "build" ]
publicDir = "artifacts/flowbase/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19868"
BASE_PATH = "/"
